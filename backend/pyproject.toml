[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingos-backend"
version = "0.1.0"
description = "Practice-first FastAPI control plane for TradingOS"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43.0,<46.0",
  "fastapi>=0.115,<1.0",
  "iqair>=1.0.0",
  "numpy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic-settings>=2.6,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
ai = ["aircore-project @ git+https://github.com/Omerhrr/aircore.git", "openai>=1.0,<2.0"]

[tool.setuptools]
packages = ["app", "app.services"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
